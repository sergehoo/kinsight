# ============================================================================
# k-insight — déploiement PRODUCTION via Dokploy (Compose + Traefik).
#
# À utiliser comme « Compose Path » dans Dokploy : ./docker-compose.dokploy.yml
# - Traefik (réseau externe `dokploy-network`) est le SEUL reverse proxy. Il route
#   trois chemins : `/` vers le frontend, `/api` et `/manage/app/back` vers le
#   backend. nginx ne sert plus que le build React et les fichiers statiques —
#   deux proxys en série multipliaient les modes de panne sans rien apporter.
# - Pas de ports publiés, pas de `container_name`/`name:` figés : Dokploy gère le
#   nommage du projet et l'orchestration.
# - Renseigner les variables (DOMAIN, secrets…) dans l'onglet Environment de Dokploy
#   — voir .env.dokploy.example et infra/dokploy/README.md.
# ============================================================================

x-backend-env: &backend-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: ${DOMAIN:?DOMAIN is required},localhost,127.0.0.1
  CSRF_TRUSTED_ORIGINS: https://${DOMAIN:?DOMAIN is required}
  SECURE_SSL_PROXY: "1"
  # Qui a le droit de dire d'où vient une requête. Le backend partage
  # `dokploy-network` avec les autres projets : sans cette liste, n'importe quel
  # conteneur voisin pourrait écrire X-Forwarded-For/Proto et choisir l'adresse
  # inscrite dans la piste d'audit comme le protocole que Django croit voir.
  # Le nom est résolu à la volée (l'adresse du conteneur Traefik change à chaque
  # déploiement). Vérifier le nom réel avec :
  #   docker ps --format '{{.Names}}' | grep -i traefik
  TRUSTED_PROXY_HOSTS: ${TRUSTED_PROXY_HOSTS:-dokploy-traefik}
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
  DJANGO_SECURE_COOKIES: "1"
  APP_DB_HOST: kinsight-postgres
  APP_DB_PORT: "5432"
  APP_DB_NAME: ${APP_DB_NAME:-k_insight_app}
  APP_DB_USER: ${APP_DB_USER:-k_insight_app}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
  EDW_DB_HOST: kinsight-postgres
  EDW_DB_PORT: "5432"
  EDW_DB_NAME: ${EDW_DB_NAME:-k_insight_edw}
  EDW_DB_USER: ${EDW_DB_USER:-k_insight_app}
  EDW_DB_PASSWORD: ${EDW_DB_PASSWORD:?EDW_DB_PASSWORD is required}
  REDIS_URL: redis://kinsight-redis:6379/0
  CELERY_BROKER_URL: redis://kinsight-redis:6379/1

networks:
  dokploy-network:
    external: true
  kinsight:
    driver: bridge

volumes:
  kinsight-postgres-data:
  kinsight-redis-data:
  kinsight-minio-data:
  kinsight-django-static:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_DB_NAME: ${APP_DB_NAME:-k_insight_app}
      APP_DB_USER: ${APP_DB_USER:-k_insight_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
      EDW_DB_NAME: ${EDW_DB_NAME:-k_insight_edw}
      EDW_DB_USER: ${EDW_DB_USER:-k_insight_app}
      EDW_DB_PASSWORD: ${EDW_DB_PASSWORD:?EDW_DB_PASSWORD is required}
      DBT_DB_USER: ${DBT_DB_USER:-k_insight_dbt}
      DBT_DB_PASSWORD: ${DBT_DB_PASSWORD:?DBT_DB_PASSWORD is required}
      AIRBYTE_DB_USER: ${AIRBYTE_DB_USER:-k_insight_airbyte}
      AIRBYTE_DB_PASSWORD: ${AIRBYTE_DB_PASSWORD:-change-me}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    volumes:
      - kinsight-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    networks:
      kinsight:
        aliases: [postgres, kinsight-postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - kinsight-redis-data:/data
    networks:
      kinsight:
        aliases: [redis, kinsight-redis]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - kinsight-minio-data:/data
    networks:
      kinsight:
        aliases: [minio, kinsight-minio]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 8

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
      CORS_ALLOWED_ORIGINS: https://${DOMAIN:?DOMAIN is required}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL_SYNTHESIS: ${AI_MODEL_SYNTHESIS:-claude-opus-4-8}
      MINIO_ENDPOINT: kinsight-minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-k-insight-exports}
    # `lock_timeout` sur migrate : sans lui, un ALTER TABLE qui attend un verrou
    # (une session restée « idle in transaction » suffit) bloque INDÉFINIMENT. Le
    # conteneur reste alors « Up » — donc `restart: unless-stopped` ne le relance
    # pas — avec rien qui écoute sur 8000, et le proxy renvoie un 502 immédiat sans
    # la moindre trace de cause. Avec la borne, migrate ÉCHOUE bruyamment dans les
    # journaux au bout de 10 s, ce qui est diagnosticable.
    command: >
      sh -c "PGOPTIONS='-c lock_timeout=10s' python manage.py migrate --noinput
      && python manage.py collectstatic --noinput
      && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3} --timeout 60"
    volumes:
      - kinsight-django-static:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      kinsight:
      # `kinsight-backend` : alias UNIQUE au projet.
      #
      # « backend » tout court est un nom que d'autres projets Dokploy portent aussi
      # sur le réseau partagé. Or le résolveur de Docker répond avec les
      # enregistrements du réseau PARTAGÉ et ne redescend pas sur le privé : tout
      # conteneur attaché aux deux réseaux résolvait le service d'autrui. C'est
      # l'origine exacte du 502 de production — nginx écrivait vers deux adresses
      # étrangères, toutes deux fermées, pendant que notre backend écoutait.
      #
      # Même raison pour `kinsight-postgres`, `kinsight-redis` et `kinsight-minio` :
      # ce service voit désormais le réseau partagé, il ne doit surtout pas y
      # résoudre la base de données d'un autre locataire.
        aliases: [backend, kinsight-backend]
      # Traefik route directement vers ce service : il doit partager son réseau.
      # Le routage se déclare dans l'onglet « Domains » de Dokploy — jamais en
      # labels ici, deux jeux de labels sur un même conteneur produisent un 502.
      dokploy-network:
        aliases: [kinsight-backend]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=3).read()\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 8

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
    command: ["celery", "-A", "config.celery", "worker", "--loglevel=INFO"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kinsight

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
    command: ["celery", "-A", "config.celery", "beat", "--loglevel=INFO"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kinsight

  frontend:
    build:
      context: .
      dockerfile: frontend/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_USE_MOCK: "false"
        VITE_API_TOKEN: ${VITE_API_TOKEN:-}
    restart: unless-stopped
    volumes:
      - kinsight-django-static:/var/www/django-static:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kinsight
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 8
    # ⚠️ Routage géré ENTIÈREMENT par l'UI « Domains » de Dokploy (Host + TLS + port cible).
    # NE PAS ajouter de labels `traefik.*` ici : ils créaient un 2ᵉ jeu de services sur le même
    # conteneur → erreur Traefik « cannot be linked automatically with multiple Services » → 502.
    # Dans l'UI Dokploy : domaine insight.kaydan.tech, Path /, Port = 8080 (port nginx), HTTPS.

  # Transformations dbt (opt-in) : exécuter via Dokploy "Run" ou
  # `docker compose -f docker-compose.dokploy.yml --profile dbt run --rm dbt build`.
  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.8.latest
    profiles: ["dbt"]
    working_dir: /usr/app
    environment:
      DBT_HOST: postgres
      DBT_PORT: "5432"
      DBT_DB: ${EDW_DB_NAME:-k_insight_edw}
      DBT_USER: ${DBT_DB_USER:-k_insight_dbt}
      DBT_PASSWORD: ${DBT_DB_PASSWORD:?DBT_DB_PASSWORD is required}
      DBT_SCHEMA: ${DBT_SCHEMA:-warehouse}
    volumes:
      - ./warehouse/dbt:/usr/app
      - ./infra/dbt:/root/.dbt:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kinsight
    entrypoint: ["dbt"]
    command: ["build"]
