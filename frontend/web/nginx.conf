# Conserve le schéma d'origine derrière un reverse proxy TLS (Traefik/Dokploy) :
# on réutilise X-Forwarded-Proto entrant s'il existe, sinon on retombe sur $scheme (dev direct).
map $http_x_forwarded_proto $kinsight_forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 8080;
  server_name _;

  # Résolution DNS À CHAQUE REQUÊTE via le DNS interne de Docker.
  #
  # Avec un nom d'hôte littéral dans `proxy_pass`, nginx ne résout `backend`
  # QU'UNE FOIS, au chargement de la configuration, et conserve cette adresse
  # jusqu'à son propre redémarrage. Au moindre redéploiement du backend — donc à
  # chaque `git push` — le conteneur repart avec une nouvelle IP, nginx continue
  # d'écrire vers l'ancienne, et TOUT /api/ tombe en 502 immédiat alors que le
  # backend est parfaitement vivant. Passer par une variable force nginx à
  # redemander l'adresse, avec un cache borné à 10 s.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 3s;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    # `set` + variable : indispensable pour que le `resolver` ci-dessus s'applique.
    # `$request_uri` reprend le chemin ET la chaîne de requête d'origine ; comme
    # /api/ est proxifié vers /api/, la correspondance reste à l'identique.
    set $kinsight_backend backend;
    proxy_pass http://$kinsight_backend:8000$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $kinsight_forwarded_proto;
    # Amont mort : échouer en 5 s plutôt que de faire patienter 60 s.
    proxy_connect_timeout 5s;
    # Au-delà de la limite de gunicorn (60 s), pour que ce soit gunicorn qui
    # tranche et non nginx : deux délais identiques se courent après et
    # transforment un traitement lent en 502 illisible.
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
  }

  location /admin/ {
    set $kinsight_backend_admin backend;
    proxy_pass http://$kinsight_backend_admin:8000$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $kinsight_forwarded_proto;
    # Amont mort : échouer en 5 s plutôt que de faire patienter 60 s.
    proxy_connect_timeout 5s;
    # Au-delà de la limite de gunicorn (60 s), pour que ce soit gunicorn qui
    # tranche et non nginx : deux délais identiques se courent après et
    # transforment un traitement lent en 502 illisible.
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
  }

  location /static/ {
    alias /var/www/django-static/;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location /assets/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
