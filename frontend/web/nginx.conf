# nginx ne sert QUE le build React et les fichiers statiques. Il n'est plus un
# reverse proxy : Traefik, fourni par Dokploy, est le seul routeur de la pile.
#
# Ce qui a motivé le changement : deux proxys en série multipliaient les modes de
# panne sans rien apporter. nginx résolvait « backend » sur un réseau Docker partagé
# où d'autres projets exposent un service du même nom — il écrivait donc vers un
# amont étranger, et rendait un 502 alors que le backend du projet écoutait
# parfaitement. Un routeur, une source de vérité.
#
# Routage attendu côté Dokploy (onglet « Domains ») :
#     /                     → frontend:8080  (ce conteneur)
#     /api                  → backend:8000
#     /manage/app/back      → backend:8000   (admin Django)
#
# `/admin/...` appartient au SPA, pas à Django : ce sont ses routes
# /admin/integrations, /admin/integrations/new… servies par le repli ci-dessous.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Fichiers statiques de Django (admin), déposés par `collectstatic` dans le volume
  # partagé. Ils restent servis ici : sous la règle Traefik `/`, c'est ce conteneur
  # qui les reçoit — et c'est ce qui habille l'admin Django.
  location /static/ {
    alias /var/www/django-static/;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location /assets/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Garde-fous. Si ces chemins arrivent jusqu'ici, c'est que la règle Traefik
  # correspondante manque. Sans eux, ils tomberaient dans le repli SPA ci-dessous
  # et une requête JSON recevrait la page HTML de l'application avec un code 200 —
  # le pire des diagnostics. Un 503 explicite nomme la cause.
  location /api/ {
    add_header Content-Type text/plain always;
    return 503 "K-Insight : la regle Traefik /api -> backend:8000 est absente. A declarer dans l'onglet Domains de Dokploy.\n";
  }

  location /manage/app/back/ {
    add_header Content-Type text/plain always;
    return 503 "K-Insight : la regle Traefik /manage/app/back -> backend:8000 est absente. A declarer dans l'onglet Domains de Dokploy.\n";
  }

  # Repli du SPA : toute autre route est rendue par React, y compris
  # /admin/integrations et ses sous-chemins, qui doivent survivre à un
  # rechargement direct du navigateur.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
